name: Deploy FC

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-fc-ap-northeast-2-binance-trade-sync
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-deploy.txt

      - name: Install production dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Test function
        run: |
          npm run check
          npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install FC deployment SDK
        run: python -m pip install -r scripts/requirements-deploy.txt

      - name: Test deployment and configuration preservation
        run: python -m unittest discover -s test -p 'test_deploy_fc.py' -v

      - name: Package function
        run: python scripts/package.py

      - name: Check main still points to this commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          if [ "$current_sha" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit exists; skipping this outdated deployment.'
          fi

      - name: Deploy and verify FC code
        if: steps.current.outputs.deploy == 'true'
        env:
          ALIYUN_FC_ACCESS_KEY_ID: ${{ secrets.ALIYUN_FC_ACCESS_KEY_ID }}
          ALIYUN_FC_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_FC_ACCESS_KEY_SECRET }}
        run: python scripts/deploy_fc.py
